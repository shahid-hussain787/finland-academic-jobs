name: Update positions

on:
  schedule:
    # 05:10 UTC daily. GitHub runs scheduled jobs on a shared queue, so
    # expect drift of up to an hour and the occasional skipped day.
    - cron: "10 5 * * *"
  workflow_dispatch:        # lets you run it by hand from the Actions tab
  push:
    branches: [main]
    paths:
      - "universities.yml"
      - "scrapers.py"
      - "scrape.py"

permissions:
  contents: write
  issues: write             # needed to open the alert issue

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Scrape university job pages
        run: python scrape.py --debug

      - name: Commit updated positions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # The scrape takes about a minute, and anything you commit during
          # that minute leaves this checkout behind the remote, so the push
          # is refused. Rather than merge, rebuild on top of whatever main
          # looks like now: jobs.json is regenerated from scratch every run,
          # so there is never anything in it worth merging.
          for attempt in 1 2 3; do
            cp docs/jobs.json /tmp/jobs.json
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/jobs.json docs/jobs.json

            git add docs/jobs.json
            if git diff --staged --quiet; then
              echo "No change in open positions."
              exit 0
            fi

            git commit -m "Update positions ($(date -u +%Y-%m-%d))"
            if git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi

            echo "Push rejected — someone committed while we were running. Retrying."
            sleep 5
          done

          echo "Could not push after 3 attempts."
          exit 1

      - name: Open an issue if a source is failing
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ ! -s failures.txt ]; then
            echo "Every source worked."
            exit 0
          fi

          TITLE="A job source has stopped working"

          # If an alert issue is already open, stay quiet. Otherwise a site
          # that stays broken would email you every single morning.
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" \
                       --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            echo "Issue #$EXISTING is already open; not filing another."
            exit 0
          fi

          {
            echo "The daily run couldn't read one or more university job pages."
            echo
            echo '```'
            cat failures.txt
            echo '```'
            echo
            echo "Open the page yourself and see what changed. If the university"
            echo "has moved to a new recruitment system, add the new address to"
            echo "the top of that university's \`urls:\` list in \`universities.yml\`"
            echo "and leave the old one underneath."
            echo
            echo "Full log: $RUN_URL"
            echo
            echo "Close this issue once it's fixed, so the next failure can alert you."
          } > body.md

          gh issue create --title "$TITLE" --body-file body.md
