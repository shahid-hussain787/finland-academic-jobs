name: Update positions

on:
  schedule:
    # 05:10 UTC daily — early morning in Finland, before anyone checks.
    # GitHub runs scheduled jobs on a shared queue, so expect some drift.
    - cron: "10 5 * * *"
  workflow_dispatch:        # lets you run it by hand from the Actions tab
  push:
    branches: [main]
    paths:
      - "universities.yml"
      - "scrapers.py"
      - "scrape.py"

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Scrape university job pages
        run: python scrape.py --debug

      - name: Commit updated positions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/jobs.json
          if git diff --staged --quiet; then
            echo "No change in open positions."
          else
            git commit -m "Update positions ($(date -u +%Y-%m-%d))"
            git push
          fi
