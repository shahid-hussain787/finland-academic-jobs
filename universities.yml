# Each entry describes one university and how to read its job listings.
#
# urls:      one or more addresses. ALL of them are fetched and the results
#            merged, so this serves two purposes at once:
#              - extra language listings (many Finnish sites keep separate
#                English and Finnish lists, with different positions on each)
#              - survival when a university moves. Put the new address first
#                and leave the old one below; whichever still works is used,
#                and the source only counts as failed if every URL fails.
# link:      the page a visitor should open, when that differs from what the
#            scraper fetches. Helsinki is read through an API endpoint that
#            would be useless to a human, so it needs one. Defaults to the
#            first entry in urls.
# parser:    which function in scrapers.py handles this page layout
# verified:  true  = parser confirmed against the live page
#            false = best guess; the site shows a warning about it
#
# Careful with second-language listings: if a university advertises the same
# position in both English and Finnish, the two have different links and will
# both appear. Add a second language only where the first list is thin.

universities:

  - name: University of Oulu
    short: Oulu
    urls:
      - https://oulunyliopisto.varbi.com/en/
    parser: varbi
    verified: true

  - name: Aalto University
    short: Aalto
    urls:
      - https://www.aalto.fi/en/open-positions
    parser: aalto
    verified: true
    max_pages: 5

  - name: University of Vaasa
    short: Vaasa
    urls:
      - https://uva.rekrytointi.com/paikat/?o=A_LOJ&list=6&lang=en
    parser: rekrytointi
    verified: true
    # Vaasa advertises almost everything in Finnish and often nothing in
    # English. Asking for the Finnish list by URL does not work: the site
    # hands out a session token and silently redirects back to English
    # without it. follow_languages makes the scraper follow the language
    # links the page itself prints, token included.
    follow_languages: true

  - name: Åbo Akademi University
    short: Åbo Akademi
    urls:
      - https://abo.rekrytointi.com/paikat/index.php?o=A_LOJ&list=1&key=&lang=en
    parser: rekrytointi
    verified: true
    follow_languages: true

  - name: Tampere University
    short: Tampere
    urls:
      - https://www.tuni.fi/en/about-us/working-at-tampere-universities/open-positions-at-tampere-university
      # Tampere publishes EVERY position in Finnish and only the ones not
      # requiring Finnish in English, so the English page alone shows a
      # fraction of what is open. Most postings carry a bilingual title.
      # If you start seeing the same job listed twice, delete this line.
      - https://www.tuni.fi/fi/tau/toihin-yliopistoon/avoimet-tyopaikat
    parser: tampere
    verified: true

  - name: University of Eastern Finland
    short: UEF
    urls:
      - https://www.uef.fi/en/open-positions
    parser: uef
    verified: true

  - name: University of Jyväskylä
    short: Jyväskylä
    urls:
      - https://www.jyu.fi/en/about-us/work-with-us/current-vacancies-at-the-university-of-jyvaskyla
    # JYU posts to Talentadore, a different system again. Anchoring on that
    # link target is far more reliable than the old guess-the-links parser,
    # which is why this was reporting nothing.
    parser: talentadore
    verified: true

  # --- Listed for browsing only: not scraped, no parser runs. The site
  # --- shows these with a "browse directly" link instead of a position
  # --- count, so nobody mistakes an empty result for "nothing is open".

  - name: University of Turku
    short: Turku
    urls:
      - https://www.utu.fi/en/university/come-work-with-us/open-vacancies
    # Turku's listings are served from rekry.saima.fi, whose robots.txt
    # disallows automated access. We respect that and do not scrape it.
    # Please don't "fix" this by ignoring robots.txt.
    link_only: true

  - name: University of Helsinki
    short: Helsinki
    urls:
      # Their careers page contains no jobs at all; this is the endpoint it
      # calls to fill itself in. The three nulls are the filter dropdowns
      # (unit, job type, keyword) and the last digit is the page number.
      # helsinki.fi/robots.txt permits this path: its only ajax rule is
      # "Disallow: /ajax/", which this is not under.
      - https://www.helsinki.fi/en/ajax_get_jobs/en/null/null/null/0
    link: https://www.helsinki.fi/en/about-us/careers/open-positions
    # Drupal AJAX routes commonly answer 403 unless the request carries the
    # headers a browser sends when the page's own script calls them. These
    # are the two a browser always includes; nothing here disguises the
    # scraper, whose identity stays in the User-Agent.
    headers:
      X-Requested-With: XMLHttpRequest
      Referer: https://www.helsinki.fi/en/about-us/careers/open-positions
      Accept: application/json, text/javascript, */*; q=0.01
    parser: helsinki
    page_by_number: true
    max_pages: 12
    verified: true

# Positions whose title matches any of these are tagged, so the page can
# filter by category. Order matters: first match wins.
categories:
  # Postdoc is tested first on purpose: "doctoral" is a substring of
  # "postdoctoral", so the order here is load-bearing.
  Postdoc: "(?i)(post-?\\s?doc|tutkijatohtori)"
  Doctoral: "(?i)((?<!post)(?<!post-)(?<!post )doctoral|\\bphd\\b|väitöskirja|tohtorikoulutettava)"
  Professor: "(?i)(professor|professori|tenure track)"
  Researcher: "(?i)(researcher|tutkija|scientist)"
  Teaching: "(?i)(lecturer|teacher|lehtori|opettaja)"
